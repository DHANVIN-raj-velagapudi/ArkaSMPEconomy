# ==============================================================================
#  ArkaSMPEconomy  -  Stage 1 (money, /pay, /baltop, hourly reward, /trade)
#  Currency is rupees only. All amounts below are in RUPEES (not paise).
#  Text uses MiniMessage:  <green>text</green>  <bold>  <gray>  etc.
#  After editing run:  /arkaeco reload
# ==============================================================================

# MANAGED BY THE PLUGIN - DO NOT CHANGE THIS LINE. It stores the plugin version that last updated this file.
# When you install a newer version, new options are added below automatically and your settings are kept
# (a backup of the old file goes to the config-backups folder).
config-version: "auto"

currency:
  symbol: "₹"
  compact: true              # show big amounts short: 1.5k from 1,000, 2.5L from 1 lakh (100k), 1Cr from 1 crore (100L). false = full numbers

economy:
  start-balance: 1000        # what a new player begins with
  max-balance: 1000000000    # nobody can hold more than this (hard limit 1,000,000,000,000)

pay:
  minimum: 1                 # smallest /pay
  maximum: 1000000           # largest single /pay
  confirm-over: 10000        # typed /pay above this asks for a second confirmation
  cooldown-seconds: 2        # delay between payments (stops spam)
  allow-offline: true        # may pay players who are offline (by name)
  menu-amounts: [10, 50, 100, 500, 1000, 5000, 10000]   # buttons in the tap-only /pay menu (max 7)

baltop:
  page-size: 10
  refresh-seconds: 30        # how often the ranking is rebuilt (async)

rewards:
  playtime:
    enabled: true
    amount: 100              # rupees paid each interval to a brand new player (the starting reward)
    growth-percent-per-hour: 3   # the reward grows EXPONENTIALLY with lifetime active hours: amount x 1.03 ^ hours
                                 # (100 -> 209 after 25 hours -> 438 after 50 hours). 0 = always the same amount
    max-amount: 1000         # the reward never grows above this (reached after about 78 active hours with the numbers above)
    interval-minutes: 60     # ACTIVE (non-AFK) minutes needed for one reward
    max-per-day: 24          # most rewards one player can earn per day (stops AFK-farm alts)

trade:
  enabled: true
  request-timeout: 60        # seconds before a trade request expires
  request-cooldown: 5        # seconds between sending requests
  countdown: 3               # seconds after both press ready, before the swap
  lopsided-warning:          # warns (once) when you give far more than you get, by shop sell price
    enabled: true
    ratio: 3.0               # warn when what you give is worth this many times what you get...
    min-difference: 500      # ...and the difference is at least this many rupees
  money-steps: [100, 1000]   # the small and big +/- rupee buttons inside the trade window
  block-in-combat: true
  block-while-afk: true
  block-creative: true       # creative/spectator players cannot trade
  blocked-items:             # these can never be offered
    - BEDROCK
    - BARRIER
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - COMMAND_BLOCK_MINECART
    - STRUCTURE_BLOCK
    - STRUCTURE_VOID
    - JIGSAW
    - LIGHT
    - DEBUG_STICK
    - KNOWLEDGE_BOOK
    - SPAWNER
    - TRIAL_SPAWNER
    - VAULT
    - REINFORCED_DEEPSLATE
    - PETRIFIED_OAK_SLAB
    - END_PORTAL_FRAME

shop:
  enabled: true
  max-buy: 2304              # most items one purchase can give (36 stacks of 64)
  big-buy-confirm: 5000      # buying for this much or more asks "are you sure?"
  # Prices, buy multiplier, craft factor and the anti-farm sell limits live in base-prices.yml.
  # Change single prices in-game with /shopadmin set <item> <sell> [buy] (saved in price-overrides.yml).

log:
  keep-days: 90              # transaction log is pruned after this many days (0 = keep forever)

menus:
  pay:
    pick-title: "Pay who?"
    amount-title: "Pay {player}"
    confirm-title: "Pay {amount} to {player}?"
  shop:
    title: "Shop"
    sellgui-title: "Sell items - drop them in, then press SELL"
    title-category: "{category}"
    title-item: "{item}"
    categories:                 # rename a category here (ids: blocks wood stone colors ores copper redstone tools armor food farming mobs nether misc rare)
      blocks: "Building Blocks"
      wood: "Wood"
      stone: "Stone & Bricks"
      colors: "Colors & Glass"
      ores: "Ores & Metals"
      copper: "Copper"
      redstone: "Redstone & Transport"
      tools: "Tools & Weapons"
      armor: "Armor & Mounts"
      food: "Food"
      farming: "Farming & Plants"
      mobs: "Mob Drops"
      nether: "Nether, End & Deep Dark"
      misc: "Utility & Decoration"
      rare: "Rare & Special"       # trophies and collectibles (a fixed list, not decided by price). Move items with shop-categories.yml
  trade:
    pick-title: "Trade with who?"
    title: "Trade with {player}"
    money-minus: "<red>- {amount}"
    money-minus-lore: "<gray>Take rupees out of your offer"
    money-plus: "<green>+ {amount}"
    money-plus-lore: "<gray>Add rupees to your offer"
    my-money: "<gold>You give: <white>{amount}"
    their-money: "<gold>{player} gives: <white>{amount}"
    cancel: "<red><bold>Cancel trade"
    cancel-lore: "<gray>Everything is returned"
    ready-off: "<green><bold>Ready"
    ready-off-lore: "<gray>Tap when you are happy with the trade"
    ready-on: "<yellow><bold>Waiting... tap to un-ready"
    their-ready-on: "<green>{player} is ready"
    their-ready-off: "<gray>{player} is not ready"
    status: "<white>How it works"
    status-lore: "<gray>Tap items in your inventory to offer them.|<gray>Tap your offered items to take them back.|<gray>Any change cancels both ready buttons."

