# ------------------------------------------------------------------------------
#  PREMIUM items: rare things that are very expensive to BUY but sell for little.
#  sell = what the shop pays you (low on purpose), buy = what you pay (very high).
#  Anything crafted from a premium item can never be bought for less than its parts, so a beacon always
#  costs more than a nether star and a conduit more than its heart of the sea.
#  The premium buy price also overrides the no-buy list below.
# ------------------------------------------------------------------------------
