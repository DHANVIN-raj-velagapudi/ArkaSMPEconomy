# ==============================================================================
#  base-prices.yml  -  the ONLY hand-decided prices (sell price per item, in rupees)
#
#  Everything craftable or smeltable is DERIVED from these by the price engine, so
#  money can never be created by crafting, smelting, compacting or un-crafting:
#     crafted sell price  <=  (sum of ingredient sell prices / items made) x craft-factor
#     smelted sell price  <=  raw sell price
#     buy price           =   sell price x buy-multiplier
#  Any item NOT listed here and NOT derivable is NOT bought or sold at all (safe default).
#  Prices are tuned for ~Rs 100/hour of play-time reward and the caps in rules: below.
# ==============================================================================

rules:
  buy-multiplier: 3.0          # you pay 3x what the shop pays you: buy->sell always loses 67%
  craft-factor: 0.95           # crafted items sell for 95% of their ingredients (crafting never profits)
  smelt-factor: 1.0            # smelted/cooked item sells for the same as the raw item
  min-price: 0.01              # smallest price; cheaper items are priced per stack-rounding up to this
  # --- anti-farm limits (all per player) ---
  item-hour-cap-rupees: 600    # one item type can earn at most this much per rolling hour
                               # (cap in items = max(600, 2 x price) / price; rare items allow at least 2)
  daily-cap-rupees: 18000      # all selling together, per day
  min-play-hours: 2            # must have this much ACTIVE play time before selling (blocks alt farms)
  big-sale-confirm: 2000       # a /sell all above this shows a confirm screen

