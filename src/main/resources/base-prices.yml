# ------------------------------------------------------------------------------
#  Never sold to the shop (even if craftable): infinite or exploitable sources,
#  or items whose value lives in NBT (the engine also refuses any item with
#  enchantments, a custom name/lore, damage, or contents).
# ------------------------------------------------------------------------------
no-sell:
  - ROTTEN_FLESH                 # zombie-farm junk
  - POISONOUS_POTATO
  - "*_LEAVES"                   # free by shearing
  - MILK_BUCKET
  - WATER_BUCKET
  - LAVA_BUCKET
  - POWDER_SNOW_BUCKET
  - COD_BUCKET
  - SALMON_BUCKET
  - PUFFERFISH_BUCKET
  - TROPICAL_FISH_BUCKET
  - AXOLOTL_BUCKET
  - TADPOLE_BUCKET                # the plain empty BUCKET is derived and can be sold
  - DRAGON_EGG
  - ENCHANTED_BOOK
  - POTION
  - SPLASH_POTION
  - LINGERING_POTION
  - TIPPED_ARROW
  - EXPERIENCE_BOTTLE
  - SPAWNER
  - TRIAL_SPAWNER
  - "*_SPAWN_EGG"
  - "*_SMITHING_TEMPLATE"
  - "*_POTTERY_SHERD"
  - "MUSIC_DISC_*"
  - FILLED_MAP
  - WRITTEN_BOOK
  - OMINOUS_BOTTLE
  - OMINOUS_TRIAL_KEY
  - TRIAL_KEY
  - GOAT_HORN
  - BUNDLE
  - "*_BUNDLE"
  - "*SHULKER_BOX"                # may hold hidden items

# ------------------------------------------------------------------------------
#  Never sold BY the shop. Anything whose recipe uses one of these is also not for sale.
#  Emeralds stay out so villager trading cannot be skipped or looped. Rare items are bought through the
#  "premium:" section above instead, at very high prices.
# ------------------------------------------------------------------------------
no-buy:
  - EMERALD
  - EMERALD_ORE
  - DEEPSLATE_EMERALD_ORE
  - "*_SPAWN_EGG"
